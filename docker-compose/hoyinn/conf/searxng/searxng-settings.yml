general:
  debug: false
  instance_name: 'SearXNG 中文定制版'
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true
  open_metrics: ''

brand:
  new_issue_url: https://github.com/searxng/searxng/issues/new
  docs_url: https://docs.searxng.org/
  public_instances: https://searx.space
  wiki_url: https://github.com/searxng/searxng/wiki
  issue_url: https://github.com/searxng/searxng/issues

search:
  safe_search: 0
  autocomplete: 'baidu'
  autocomplete_min: 2
  favicon_resolver: 'duckduckgo'
  default_lang: 'zh-CN'
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800
  formats:
    - html
    - json

server:
  port: 8888
  bind_address: '0.0.0.0'  # 允许外部访问
  base_url: /
  limiter: false
  public_instance: false
  secret_key: '请替换为随机生成的32位以上字符串'  # 建议用: openssl rand -hex 32
  image_proxy: false
  http_protocol_version: '1.1'
  method: 'POST'
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer
    X-Forwarded-For: 127.0.0.1  # 解决X-Forwarded-For缺失问题
    X-Real-IP: 127.0.0.1        # 解决X-Real-IP缺失问题

redis:
  url: false

ui:
  static_path: ''
  static_use_hash: false
  templates_path: ''
  query_in_title: false
  infinite_scroll: true
  default_theme: simple
  center_alignment: true
  default_locale: 'zh_CN'
  theme_args:
    simple_style: auto
  search_on_category_select: true
  hotkeys: default
  url_formatting: pretty

outgoing:
  request_timeout: 10.0  # 延长超时时间适配国内网络
  max_request_timeout: 15.0
  useragent_suffix: ''
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: false  # 禁用HTTP2减少兼容性问题
  # 如需代理请取消注释并配置
  # proxies:
  #   all://:
  #     - http://127.0.0.1:7890  # 替换为你的代理地址
  using_tor_proxy: false
  extra_proxy_timeout: 5

enabled_plugins:
  - 'Basic Calculator'
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker URL remover'
  - 'Unit converter plugin'

hostnames:
  replace:
    '(.*\.)?youtube\.com$': 'bilibili.com'
    '(.*\.)?youtu\.be$': 'bilibili.com'
    '(.*\.)?twitter\.com$': 'weibo.com'
    '(.*\.)?reddit\.com$': 'tieba.baidu.com'

checker:
  off_when_debug: true
  scheduling: false  # 禁用检查器减少网络请求

categories_as_tabs:
  general:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:

engines:
  # 仅保留国内可访问且稳定的引擎
  - name: 百度
    engine: baidu
    shortcut: bd
    disabled: false
    categories: [general, web]
    timeout: 10.0
    max_redirects: 2

  - name: 百度图片
    engine: baidu_images
    shortcut: bdi
    categories: [images]
    disabled: false
    timeout: 10.0

  - name: 百度新闻
    engine: baidu_news
    shortcut: bdn
    categories: [news]
    disabled: false
    timeout: 10.0

  - name: 必应中国
    engine: bing
    shortcut: bi
    disabled: false
    categories: [general, web]
    timeout: 10.0
    max_redirects: 2
    base_url: 'https://cn.bing.com'

  - name: 必应图片中国
    engine: bing_images
    shortcut: bii
    categories: [images]
    disabled: false
    timeout: 10.0
    base_url: 'https://cn.bing.com'

  - name: 必应新闻中国
    engine: bing_news
