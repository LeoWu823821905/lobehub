name: hoyinn
services:
  network-service:
    image: alpine
    container_name: hoyinn-network
    restart: always
    ports:
      - '${MINIO_PORT}:9000' # MinIO API
      - '${MINIO_CONSOLE_PORT}:9001' # MinIO Console
      - '${CASDOOR_PORT}:8080' # Casdoor
      - '${LOBE_PORT}:3210' # LobeChat
      - '${GRAFANA_PORT}:3000' # Grafana
      # - '${OTEL_HTTP_PORT}:4318' # otel-collector HTTP
      # - '${OTEL_GRPC_PORT}:4317' # otel-collector gRPC
      # - '${POSTGRES_PORT}:5432' # PostgreSQL
      # - '${REDIS_PORT}:6379' # Redis
    expose:
      - '5432' # PostgreSQL
      - '6379' # Redis
      - '4318' # otel-collector HTTP
      - '4317' # otel-collector gRPC
    command: tail -f /dev/null
    networks:
      - hoyinn-network

  postgresql:
    image: paradedb/paradedb:latest
    container_name: hoyinn-postgres
    network_mode: 'service:network-service'
    # ports:
    #   - '${POSTGRES_PORT}:5432'
    volumes:
      - './data/postgresql:/var/lib/postgresql'
    environment:
      - 'POSTGRES_DB=${LOBE_DB_NAME}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hoyinn-redis
    network_mode: 'service:network-service'
    # ports:
    #   - '${REDIS_PORT}:6379'
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - './data/redis:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hoyinn-minio
    network_mode: 'service:network-service'
    volumes:
      - './data/minio:/etc/minio/data'
    environment:
      - 'MINIO_API_CORS_ALLOW_ORIGIN=*'
    env_file:
      - .env
    restart: always
    entrypoint: >
      /bin/sh -c "
        minio server /etc/minio/data --address ':${MINIO_PORT}' --console-address ':9001' &
        MINIO_PID=$!
        while ! curl -s http://127.0.0.1:9000/minio/health/live; do
          echo 'Waiting for MinIO to start...'
          sleep 1
        done
        sleep 5
        mc alias set myminio http://127.0.0.1:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        echo 'Creating bucket ${MINIO_LOBE_BUCKET}'
        mc mb myminio/${MINIO_LOBE_BUCKET}
        wait $MINIO_PID
      "

  # version lock ref: https://github.com/lobehub/lobe-chat/pull/7331
  casdoor:
    image: casbin/casdoor:v2.13.0
    container_name: hoyinn-casdoor
    entrypoint: /bin/sh -c './server --createDatabase=true'
    network_mode: 'service:network-service'
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      httpport: 8080
      RUNNING_IN_DOCKER: 'true'
      driverName: 'postgres'
      dataSourceName: 'user=postgres password=${POSTGRES_PASSWORD} host=127.0.0.1 port=5432 sslmode=disable dbname=casdoor'
      runmode: 'dev'
    volumes:
      - './conf/casdoor/init_data.json:/init_data.json'
    env_file:
      - .env

  searxng:
    image: searxng/searxng
    container_name: hoyinn-searxng
    ports:
      - "8888:8080"
    volumes:
      - './conf/searxng/searxng-settings.yml:/etc/searxng/settings.yml'
    environment:
      - 'SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml'
      - 'SEARXNG_ENGINES=baidu,bing'
    restart: always
    networks:
      - hoyinn-network
    env_file:
      - .env

  grafana:
    image: grafana/grafana:12.2.0-17419259409
    container_name: hoyinn-grafana
    network_mode: 'service:network-service'
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - './data/grafana:/var/lib/grafana'
      - ./conf/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./conf/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus
    container_name: hoyinn-prometheus
    network_mode: 'service:network-service'
    restart: always
    volumes:
      - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-otlp-receiver'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'

  tempo:
    image: grafana/tempo:latest
    container_name: hoyinn-tempo
    network_mode: 'service:network-service'
    restart: no
    volumes:
      - ./conf/tempo/tempo.yaml:/etc/tempo.yaml
      - ./data/tempo:/var/tempo
    command: ['-config.file=/etc/tempo.yaml']
    profiles:
      - otel-test

  otel-collector:
    image: otel/opentelemetry-collector
    container_name: hoyinn-otel-collector
    network_mode: 'service:network-service'
    restart: always
    volumes:
      - ./conf/otel-collector/collector-config.yaml:/etc/otelcol/config.yaml
    command: ['--config', '/etc/otelcol/config.yaml']
    depends_on:
      - prometheus

  otel-tracing-test:
    profiles:
      - otel-test
    image: ghcr.io/grafana/xk6-client-tracing:v0.0.9
    container_name: hoyinn-otel-tracing-test
    network_mode: 'service:network-service'
    restart: always
    environment:
      - ENDPOINT=127.0.0.1:4317

  lobe:
    image: lobehub/lobehub:2.1.46
    container_name: hoyinn-lobe
    network_mode: 'service:network-service'
    depends_on:
      postgresql:
        condition: service_healthy
      network-service:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - 'AUTH_SSO_PROVIDERS=casdoor'
      - 'AUTH_CASDOOR_ID=${AUTH_CASDOOR_CLIENT_ID}'
      - 'AUTH_CASDOOR_SECRET=${AUTH_CASDOOR_CLIENT_SECRET}'
      - 'AUTH_CASDOOR_ISSUER=${AUTH_CASDOOR_ISSUER}'
      - 'AUTH_CASDOOR_SCOPE=${AUTH_CASDOOR_SCOPE}'
      - 'KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}'
      - 'AUTH_SECRET=${AUTH_SECRET}'
      - 'DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/${LOBE_DB_NAME}'
      - 'INTERNAL_APP_URL=http://127.0.0.1:3210'
      - 'S3_ENDPOINT=http://${SERVER_HOST}:${MINIO_PORT}'
      - 'S3_BUCKET=${MINIO_LOBE_BUCKET}'
      - 'S3_ENABLE_PATH_STYLE=1'
      - 'S3_ACCESS_KEY=${MINIO_ROOT_USER}'
      - 'S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}'
      - 'S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}'
      - 'LLM_VISION_IMAGE_USE_BASE64=1'
      - 'S3_SET_ACL=0'
      - 'SEARXNG_URL=http://searxng:8080'
      - 'REDIS_URL=redis://127.0.0.1:6379'
      - 'REDIS_PREFIX=hoyinn'
      - 'REDIS_TLS=0'
      - 'OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=http/protobuf'
      - 'OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://127.0.0.1:4318/v1/metrics'
      - 'OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf'
      - 'OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://127.0.0.1:4318/v1/traces'
      - 'QSTASH_TOKEN=${QSTASH_TOKEN}'
      - 'SSRF_ALLOW_PRIVATE_IP_ADDRESS=${SSRF_ALLOW_PRIVATE_IP_ADDRESS}'
    env_file:
      - .env
    restart: always
    entrypoint: >
      /bin/sh -c "
        /bin/node /app/startServer.js &
        LOBE_PID=\$!
        sleep 3
        if [ $(wget --timeout=5 --spider --server-response ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep -c 'HTTP/1.1 200 OK') -eq 0 ]; then
          echo '⚠️Warning: Unable to fetch OIDC configuration from Casdoor'
          echo 'Request URL: ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
          echo 'Read more at: https://lobehub.com/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
          echo '⚠️注意：无法从 Casdoor 获取 OIDC 配置'
          echo '请求 URL: ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
          echo '了解更多：https://lobehub.com/zh/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
        else
          if ! wget -O - --timeout=5 ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep 'issuer' | grep ${AUTH_CASDOOR_ISSUER}; then
            printf '❌Error: The Auth issuer is conflict, Issuer in OIDC configuration is: %s' \$(wget -O - --timeout=5 ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep -E 'issuer.*' | awk -F '\"' '{print \$4}')
            echo ' , but the issuer in .env file is: ${AUTH_CASDOOR_ISSUER} '
            echo 'Request URL: ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
            echo 'Read more at: https://lobehub.com/docs/self-hosting/server-database/docker-compose#necessary-configuration'
            echo ''
            printf '❌错误：Auth 的 issuer 冲突，OIDC 配置中的 issuer 是：%s' \$(wget -O - --timeout=5 ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep -E 'issuer.*' | awk -F '\"' '{print \$4}')
            echo ' , 但 .env 文件中的 issuer 是：${AUTH_CASDOOR_ISSUER} '
            echo '请求 URL: ${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
            echo '了解更多：https://lobehub.com/zh/docs/self-hosting/server-database/docker-compose#necessary-configuration'
            echo ''
          fi
        fi
        if [ $(wget --timeout=5 --spider --server-response ${S3_ENDPOINT}/minio/health/live 2>&1 | grep -c 'HTTP/1.1 200 OK') -eq 0 ]; then
          echo '⚠️Warning: Unable to fetch MinIO health status'
          echo 'Request URL: ${S3_ENDPOINT}/minio/health/live'
          echo 'Read more at: https://lobehub.com/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
          echo '⚠️注意：无法获取 MinIO 健康状态'
          echo '请求 URL: ${S3_ENDPOINT}/minio/health/live'
          echo '了解更多：https://lobehub.com/zh/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
        fi
        wait \$LOBE_PID
      "

networks:
  hoyinn-network:
    driver: bridge