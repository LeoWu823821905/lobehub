receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

  memory_limiter:
    limit_mib: 4000
    spike_limit_mib: 800
    check_interval: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 180m

  debug:
    verbosity: detailed

  otlp:
    endpoint: localhost:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [prometheus, debug]

    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [debug, otlp]

    logs:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [debug]