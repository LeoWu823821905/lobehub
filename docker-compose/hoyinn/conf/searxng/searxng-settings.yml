general:
  debug: false
  instance_name: 'SearXNG 中文定制版'
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true
  open_metrics: ''

brand:
  new_issue_url: https://github.com/searxng/searxng/issues/new
  docs_url: https://docs.searxng.org/
  public_instances: https://searx.space
  wiki_url: https://github.com/searxng/searxng/wiki
  issue_url: https://github.com/searxng/searxng/issues

search:
  safe_search: 0
  autocomplete: 'baidu'  # 仅保留官方支持的百度自动补全
  autocomplete_min: 2
  favicon_resolver: 'duckduckgo'
  default_lang: 'zh-CN'
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800
  formats:
    - html
    - json

server:
  port: 8888
  bind_address: '0.0.0.0'
  base_url: /
  limiter: false
  public_instance: false
  secret_key: '779c5b69fe650f147be9012abca6b44a8697acdb2817b46353f4779bb07d81d1'  # 可保留你的密钥
  image_proxy: false
  http_protocol_version: '1.1'
  method: 'POST'
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer
    X-Forwarded-For: 127.0.0.1  # 解决X-Forwarded-For缺失
    X-Real-IP: 127.0.0.1        # 解决X-Real-IP缺失

redis:
  url: false

ui:
  static_path: ''
  static_use_hash: false
  templates_path: ''
  query_in_title: false
  infinite_scroll: true
  default_theme: simple
  center_alignment: true
  default_locale: 'zh_CN'
  theme_args:
    simple_style: auto
  search_on_category_select: true
  hotkeys: default
  url_formatting: pretty

outgoing:
  request_timeout: 10.0  # 延长超时适配国内网络
  max_request_timeout: 15.0
  useragent_suffix: ''
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: false  # 禁用HTTP2解决兼容性问题
  # 如需代理访问GitHub等，取消以下注释并配置
  # proxies:
  #   all://:
  #     - http://127.0.0.1:7890
  using_tor_proxy: false
  extra_proxy_timeout: 5

enabled_plugins:
  - 'Basic Calculator'
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker URL remover'
  - 'Unit converter plugin'

hostnames:
  replace:
    '(.*\.)?youtube\.com$': 'bilibili.com'
    '(.*\.)?youtu\.be$': 'bilibili.com'
    '(.*\.)?twitter\.com$': 'weibo.com'
    '(.*\.)?reddit\.com$': 'tieba.baidu.com'

checker:
  off_when_debug: true
  scheduling: false  # 禁用检查器减少网络请求

categories_as_tabs:
  general:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:

# 仅保留SearXNG官方内置且国内可访问的引擎
engines:
  - name: baidu
    engine: baidu
    shortcut: bd
    disabled: false
    categories: [general, web]
    timeout: 10.0

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    categories: [general, web]
    timeout: 10.0
    max_redirects: 2  # 解决必应重定向报错
    base_url: 'https://cn.bing.com'  # 必应国内版

  - name: bing_images
    engine: bing_images
    shortcut: bii
    categories: [images]
    disabled: false
    timeout: 10.0
    base_url: 'https://cn.bing.com'

  - name: bing_news
    engine: bing_news
    shortcut: bin
    categories: [news]
    disabled: false
    timeout: 10.0
    base_url: 'https://cn.bing.com'

  - name: bing_videos
    engine: bing_videos
    shortcut: biv
    categories: [videos]
    disabled: false
    timeout: 10.0
    base_url: 'https://cn.bing.com'

  - name: bilibili
    engine: bilibili
    shortcut: bil
    disabled: false
    categories: [videos, music]
    timeout: 10.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    display_type: ['infobox']
    categories: [general]
    timeout: 10.0
    base_url: 'https://zh.wikipedia.org'  # 维基百科中文站

  - name: github
    engine: github
    shortcut: gh
    disabled: false
    categories: [it, repos]
    timeout: 15.0  # GitHub延长超时

  - name: gitlab
    engine: gitlab
    base_url: https://gitlab.com
    shortcut: gl
    disabled: false
    categories: [it, repos]
    timeout: 10.0

  - name: codeberg
    engine: gitea
    base_url: https://codeberg.org
    shortcut: cb
    disabled: false
    categories: [it, repos]
    timeout: 10.0

  - name: archlinux
    engine: archlinux
    shortcut: al
    disabled: false
    categories: [it]
    timeout: 10.0

  - name: currency_convert
    engine: currency_convert
    categories: general
    shortcut: cc
    disabled: false

  - name: open_meteo
    engine: open_meteo
    shortcut: om
    disabled: false
    categories: [general]
    timeout: 10.0
    base_url: 'https://api.open-meteo.com'

  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
    disabled: false
    categories: [map]
    timeout: 10.0

  - name: mdn
    shortcut: mdn
    engine: json_engine
    categories: [it]
    paging: true
    search_url: https://developer.mozilla.org/api/v1/search?q={query}&page={pageno}
    results_query: documents
    url_query: mdn_url
    url_prefix: https://developer.mozilla.org
    title_query: title
    content_query: summary
    timeout: 10.0

  - name: npm
    engine: npm
    shortcut: npm
    categories: [it, packages]
    timeout: 10.0
    disabled: false

  - name: docker_hub
    engine: docker_hub
    shortcut: dh
    categories: [it, packages]
    timeout: 10.0
    disabled: false

  - name: anaconda
    engine: xpath
    paging: true
    first_page_num: 0
    search_url: https://anaconda.org/search?q={query}&page={pageno}
    results_xpath: //tbody/tr
    url_xpath: ./td/h5/a[last()]/@href
    title_xpath: ./td/h5
    content_xpath: ./td[h5]/text()
    categories: [it, packages]
    timeout: 10.0
    disabled: false

  - name: lingva
    engine: lingva
    shortcut: lv
    categories: [general]
    timeout: 10.0
    disabled: false  # 翻译引擎

  - name: mixcloud
    engine: mixcloud
    shortcut: mc
    categories: [music]
    timeout: 10.0
    disabled: false

  - name: encyclosearch
    engine: json_engine
    shortcut: es
    categories: [general]
    paging: true
    search_url: https://encyclosearch.org/encyclosphere/search?q={query}&page={pageno}&resultsPerPage=15
    results_query: Results
    url_query: SourceURL
    title_query: Title
    content_query: Description
    disabled: false
    timeout: 10.0