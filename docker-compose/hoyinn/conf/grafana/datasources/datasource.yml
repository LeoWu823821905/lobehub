apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://localhost:9090
    access: proxy
    isDefault: true
    editable: true
  - name: Tempo
    type: tempo
    url: http://localhost:3200
    access: proxy
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: 'grafana'